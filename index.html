<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Management System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#3b82f6', // Calm Blue
              primaryHover: '#2563eb',
              background: '#f8fafc', // Soft Slate 50
              surface: '#ffffff',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc; /* Matches Tailwind slate-50 */
        font-family: 'Inter', sans-serif;
      }
      /* Custom animation for the Navbar name */
      .name-glow {
        animation: subtleGlow 3s infinite alternate;
      }
      @keyframes subtleGlow {
        from { text-shadow: 0 0 5px rgba(59, 130, 246, 0.2); }
        to { text-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
